spring.application.name=kcli-website
server.port=8081

# Local/demo profile. GitHub Pages deploys only the static directory and does not run Spring.
spring.datasource.url=jdbc:h2:mem:kcli;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
